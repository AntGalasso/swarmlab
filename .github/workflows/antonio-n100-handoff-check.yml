name: Check Antonio CPU handoff offline
on:
  pull_request:
    paths:
      - 'bazt_handoff_antonio/**'
      - '.github/workflows/antonio-n100-handoff-check.yml'
permissions:
  contents: read
jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s bazt_handoff_antonio -p test_handoff.py -v
      - run: python bazt_handoff_antonio/run_n100.py --workers 8 --dry-run
