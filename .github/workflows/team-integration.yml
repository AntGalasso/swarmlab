name: Integrated BAZT validation
on:
  push:
    branches: [main, 'integration/**']
    paths: ['**/*.py', '**/*.toml', uv.lock, requirements.txt, '.github/workflows/team-integration.yml']
  pull_request:
    branches: [main]
    paths: ['**/*.py', '**/*.toml', uv.lock, requirements.txt, '.github/workflows/team-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-bazt-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
      MAX_JOBS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_MODE: offline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run python validate_integration.py
      - run: uv run python scripts/check_static.py
      - run: uv run python budget_study.py --phase fake --out results/integration/fake_study
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: integrated-bazt-validation
          path: |
            results/integration/**/*.xml
            results/integration/**/*.json
          retention-days: 14
